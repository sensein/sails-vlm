experiment:
  name: rmm_type_p4_merged_flap_f1

model:
  name: qwen3_video
  hf_model_id: Qwen/Qwen3-VL-30B-A3B-Instruct
  device: cuda
  max_new_tokens: 2048
  do_sample: true
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  local_files_only: true

output:
  save_dir: /orcd/data/satra/002/projects/SAILS/pred2annot_evaluation/rmm_type/prompt_ablation/p4_merged_flap/fold_1
  save_predictions: true

data:
  ground_truth_csv: /orcd/data/satra/002/projects/SAILS/rmm/cv_splits/fold_1_val.csv
  video_id_column: segment_id
  video_dir: /orcd/data/satra/002/projects/SAILS/rmm/classification_clips/canonical_clips
  video_path_column: video_path
  label_column: rmm_type
  drop_missing_labels: true

task:
  type: classification
  labels:
    - "hands flapping"
    - "rocking"
    - "spinning"
    - "jumping"

prompt:
  message: |
    Classify the repetitive motor movement in this video as exactly one of:
    hands flapping (one or both hands), rocking, spinning, jumping.
    Reply as `RMM: <answer>` only.

evaluation:
  metrics:
    - accuracy
    - top2_accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - per_class_metrics
    - cohen_kappa
    - confusion_matrix
