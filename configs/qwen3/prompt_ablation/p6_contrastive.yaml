experiment:
  name: rmm_type_prompt_p6_contrastive

model:
  name: qwen3_video
  hf_model_id: Qwen/Qwen3-VL-30B-A3B-Instruct
  device: cuda
  max_new_tokens: 64
  do_sample: true
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  local_files_only: true
  # max_pixels not set — use qwen_vl_utils default

output:
  save_dir: ${SAILS_DATA_ROOT}/pred2annot_evaluation/rmm_type/prompt_ablation/p6_contrastive
  save_predictions: true

data:
  ground_truth_csv: ${SAILS_DATA_ROOT}/rmm/cv_splits/fold_0_val.csv
  video_id_column: segment_id
  video_dir: ${SAILS_DATA_ROOT}/rmm/classification_clips/canonical_clips
  video_path_column: video_path
  label_column: rmm_type
  drop_missing_labels: true

task:
  type: classification
  labels:
    - "hands flapping"
    - "rocking"
    - "spinning"
    - "jumping"

prompt:
  message: |
    You are an expert annotator classifying repetitive motor movements (RMMs) in children. Use these exact definitions:

    - hands flapping: repetitive movement of the hands at the wrists either vertically or horizontally.
    - rocking: repetitive front-to-back or side-to-side movement of the body.
    - spinning: repetitive turning of the body in a circular motion.
    - jumping: repetitive bouncing of the body involving bending the knees and feet leaving or nearly leaving the floor.

    Key distinctions to watch for:
    - "hands flapping" involves wrist-driven hand movement — not whole-arm or body movement.
    - "jumping" requires the whole body to bounce with knee bend — not just shifting weight.
    - "rocking" is a weight-shift movement, not circular rotation.
    - "spinning" is full-body circular rotation, not swaying.

    Classify the movement shown and reply only as: `RMM: <answer>`

evaluation:
  metrics:
    - balanced_accuracy
    - accuracy
    - top2_accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - per_class_metrics
    - cohen_kappa
    - confusion_matrix
