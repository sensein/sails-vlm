experiment:
  name: rmm_type_p5_merged_flap_f0

model:
  name: qwen3_video
  hf_model_id: Qwen/Qwen3-VL-30B-A3B-Instruct
  device: cuda
  max_new_tokens: 2048
  do_sample: true
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  local_files_only: true

output:
  save_dir: /orcd/scratch/bcs/001/sensein/sails/pred2annot_evaluation/rmm_type/prompt_ablation/p5_merged_flap/fold_0
  save_predictions: true

data:
  ground_truth_csv: /orcd/data/satra/001/users/brukew/actreg/dataprep/splits/cv_splits/fold_0_val.csv
  video_id_column: segment_id
  video_dir: /orcd/data/satra/002/projects/SAILS/rmm/classification_clips/canonical_clips
  video_path_column: video_path
  label_column: rmm_type
  drop_missing_labels: true

task:
  type: classification
  labels:
    - "hands flapping"
    - "rocking"
    - "spinning"
    - "jumping"

prompt:
  message: |
    You are a certified pediatric behavioral analyst specializing in repetitive motor movements (RMMs) in children with autism spectrum disorder. You have 20 years of clinical experience coding movement behaviors from video.

    The movement categories and their definitions are:
    - hands flapping: one or both hands flap repeatedly at the wrists, either vertically or horizontally
    - rocking: repetitive front-to-back or side-to-side movement of the body
    - spinning: repetitive turning of the body in a circular motion
    - jumping: repetitive bouncing of the body involving bending the knees and feet leaving or nearly leaving the floor

    Watch the video carefully. Before answering, briefly reason through what you observe:
    1. Which body part(s) are moving?
    2. What is the movement's direction and pattern?
    3. Which definition best matches?

    End your response with: `RMM: <answer>`

evaluation:
  metrics:
    - accuracy
    - top2_accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - per_class_metrics
    - cohen_kappa
    - confusion_matrix
