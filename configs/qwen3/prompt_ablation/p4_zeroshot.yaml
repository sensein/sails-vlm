experiment:
  name: rmm_type_prompt_p4_zeroshot

model:
  name: qwen3_video
  hf_model_id: Qwen/Qwen3-VL-30B-A3B-Instruct
  device: cuda
  max_new_tokens: 64
  do_sample: true
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  local_files_only: true
  # max_pixels not set — use qwen_vl_utils default

output:
  save_dir: ${SAILS_DATA_ROOT}/pred2annot_evaluation/rmm_type/prompt_ablation/p4_zeroshot
  save_predictions: true

data:
  ground_truth_csv: ${SAILS_DATA_ROOT}/rmm/cv_splits/fold_0_val.csv
  video_id_column: segment_id
  video_dir: ${SAILS_DATA_ROOT}/rmm/classification_clips/canonical_clips
  video_path_column: video_path
  label_column: rmm_type
  drop_missing_labels: true

task:
  type: classification
  labels:
    - "hands flapping"
    - "rocking"
    - "spinning"
    - "jumping"

prompt:
  message: |
    Classify the repetitive motor movement in this video as exactly one of:
    hands flapping, rocking, spinning, jumping.
    Reply as `RMM: <answer>` only.

evaluation:
  metrics:
    - balanced_accuracy
    - accuracy
    - top2_accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - per_class_metrics
    - cohen_kappa
    - confusion_matrix
