experiment:
  name: rmm_type_cosmos_reason2
  # no fixed seed — each run samples differently

model:
  name: cosmos
  hf_model_id: nvidia/Cosmos-Reason2-8B
  device: cuda
  frames_per_sample: 8
  samples_per_clip: 4
  max_new_tokens: 64
  do_sample: true
  temperature: 0.7
  local_files_only: true

output:
  save_dir: /orcd/data/satra/002/projects/SAILS/pred2annot_evaluation/rmm_type/cosmos
  save_predictions: true

data:
  ground_truth_csv: /orcd/data/satra/002/projects/SAILS/rmm/cv_splits/fold_0_val.csv
  video_id_column: segment_id
  video_dir: /orcd/data/satra/002/projects/SAILS/rmm/classification_clips/canonical_clips
  video_path_column: video_path
  label_column: rmm_type
  drop_missing_labels: true

task:
  type: classification
  labels:
    - "hands flapping"
    - "rocking"
    - "spinning"
    - "jumping"

prompt:
  message: |
    Identify the repetitive motor mannerism (RMM) shown in the video frames.
    Choose exactly one option from the list and reply as `RMM: <option>` with no extra words.

    - hands flapping: repetitive movement of the hands at the wrists either vertically or horizontally.
    - rocking: repetitive front-to-back or side-to-side movement of the body.
    - spinning: repetitive turning of the body in a circular motion.
    - jumping: repetitive bouncing of the body involving bending the knees and feet leaving or nearly leaving the floor.

evaluation:
  metrics:
    - accuracy
    - top2_accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - per_class_metrics
    - cohen_kappa
    - confusion_matrix
