[project]
name = "sails-vlm"
version = "0.1.0"
description = "VLM-based automated annotation and evaluation for SAILS behavioral coding"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "decord==0.6.0",
    "numpy>=2.1",
    "pandas>=2.3",
    "scikit-learn>=1.8",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "pillow>=11.0",
    "huggingface-hub>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
qwen = ["transformers==5.14.1", "qwen-vl-utils==0.0.10", "accelerate>=1.10.0", "bitsandbytes>=0.45"]
cosmos = ["transformers==5.14.1", "accelerate>=1.10.0"]
ovis2 = ["transformers==5.14.1"]
internvl = ["transformers==5.14.1", "bitsandbytes>=0.45", "accelerate>=1.10.0"]
text-metrics = ["rouge>=1.0", "nltk>=3.9", "sentence-transformers>=3.0", "scipy>=1.14"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
sails-vlm-predict = "sails_vlm.runners.run_prediction:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sails_vlm"]
