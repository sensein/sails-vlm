# Environment for the Qwen3-VL and Cosmos-Reason2 models
name: qwen
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # Core ML
    - torch==2.6.0
    - torchvision==0.21.0
    - torchaudio==2.6.0
    - accelerate>=1.10.0
    # Transformers (Qwen3-VL and Cosmos-Reason2 require 5.0.0.dev or >=4.57)
    - git+https://github.com/huggingface/transformers.git
    # VLM utilities
    - qwen-vl-utils==0.0.10
    - decord==0.6.0
    # Data / eval
    - numpy>=2.1
    - pandas>=2.3
    - scikit-learn>=1.8
    - pyyaml>=6.0
    - tqdm>=4.67
    - pillow>=11.0
    # HF hub
    - huggingface-hub>=1.0
